<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Cloud Energy | Solar, Storage and Electric Mobility</title>
<meta name="description" content="Cloud Energy Photoelectric Limited: solar panels, inverters, lithium batteries, financing and Cloud Ride electric mobility across Nigeria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Cloud Energy brand style guide — white pages with pale-blue section surfaces and navy feature bands;
   sticky white header with full-width mega menus; 1440px max content width. One committed light look. */
:root {
  color-scheme: light;
  --navy: #0A3D5C;      /* headings, navigation, dark sections */
  --navy-2: #0D4A6F;
  --navy-deep: #07283D;
  --blue: #1190C8;      /* primary actions and accents */
  --blue-2: #0E7DAF;
  --amber: #F9A930;     /* promotions and emphasis */
  --green: #23984A;     /* stock and positive states */
  --white: #FFFFFF;
  --slate: #58697A;     /* secondary text */
  --pale: #F2F7FA;      /* section surfaces */
  --border: #D9E3EA;    /* outlines and separators */
  --ink: #0A1A26;
  --plex: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --inter: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --wrap: 1440px;
  --r: 12px; --r-lg: 16px;
  --sh: 0 10px 30px rgba(10,61,92,.08);
  --sh-lg: 0 24px 60px rgba(10,61,92,.16);
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--plex); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--white); }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--plex); color: var(--navy); line-height: 1.12; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1200px) { .wrap { padding-left: max(80px, env(safe-area-inset-left, 0px)); padding-right: max(80px, env(safe-area-inset-right, 0px)); } }
.sec { padding-block: 96px; position: relative; }
.sec.sm { padding-block: 64px; }
.pale { background: var(--pale); }
.navyband { background: var(--navy); color: #fff; }
.navyband h1, .navyband h2, .navyband h3 { color: #fff; }
.h-hero { font-size: clamp(40px, 5vw, 72px); font-weight: 700; color: #fff; line-height: 1.08; }
.h-sec { font-size: clamp(30px, 3vw, 40px); font-weight: 600; }
.h-cat { font-size: clamp(24px, 2.2vw, 32px); font-weight: 600; }
.h-card { font-size: 20px; font-weight: 600; }
.lead { font-size: 16px; line-height: 24px; color: var(--slate); max-width: 70ch; }
.navyband .lead, .on-dark .lead { color: #D3E2EC; }
.center { text-align: center; }
.center .lead { margin-inline: auto; }
.head { display: grid; gap: 14px; margin-bottom: 48px; }
.head.center { justify-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: var(--green); background: rgba(35,152,74,.07); border: 1px solid rgba(35,152,74,.35); width: fit-content; }
.tag.blue { color: var(--blue); background: rgba(17,144,200,.08); border-color: rgba(17,144,200,.3); }
.tag.dark { color: #fff; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.35); }
.tag.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }

/* buttons */
.btn { --bg: var(--blue); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 10px; border: 1.5px solid transparent; background: var(--bg); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s; position: relative; overflow: hidden; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(17,144,200,.28); }
.btn:active { transform: translateY(0); }
.btn svg { flex: none; }
.btn .ar { transition: transform .2s var(--ease); }
.btn:hover .ar { transform: translateX(4px); }
.btn.outline { background: #fff; color: var(--blue); border-color: var(--blue); }
.btn.outline:hover { background: rgba(17,144,200,.06); box-shadow: none; }
.btn.navy { --bg: var(--navy); }
.btn.navy:hover { box-shadow: 0 10px 24px rgba(10,61,92,.3); }
.btn.amber { --bg: var(--amber); color: #fff; }
.btn.white { background: #fff; color: var(--navy); }
.btn.ghost-w { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn.lg { min-height: 52px; padding: 0 26px; }
.btns { display: flex; flex-wrap: wrap; gap: 14px; }
.link { color: var(--blue); font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
.link .ar { transition: transform .2s var(--ease); }
.link:hover .ar, a:hover > .link .ar, a:hover .ar { transform: translateX(4px); }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #fff; border-bottom: 1px solid var(--border); }
.hdr-in { display: flex; align-items: center; gap: 24px; height: 88px; }
.logo { flex: none; display: block; } .logo img { height: 46px; width: auto; max-width: none; }
.nav { display: flex; align-items: center; gap: 2px; margin: 0 auto; }
.nav > a, .nav > button { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 10px 12px; font-size: 15px; font-weight: 500; color: var(--navy); text-decoration: none; background: none; border: 0; cursor: pointer; white-space: nowrap; transition: color .2s; }
.nav > a::after, .nav > button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--blue); transform: scaleX(0); transform-origin: left; transition: transform .25s var(--ease); }
.nav > a:hover, .nav > button:hover, .nav .on { color: var(--blue); }
.nav > a:hover::after, .nav > button:hover::after, .nav .on::after, .nav button[aria-expanded="true"]::after { transform: scaleX(1); }
.nav button[aria-expanded="true"] { color: var(--blue); }
.nav .chev { width: 12px; height: 12px; transition: transform .25s var(--ease); }
.nav button[aria-expanded="true"] .chev { transform: rotate(180deg); }
.hdr-cta { display: flex; gap: 12px; flex: none; }
.hdr-cta .btn { min-height: 46px; border-radius: 12px; }
.burger { display: none; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; align-items: center; justify-content: center; margin-left: auto; color: var(--navy); }
.burger svg { width: 22px; height: 22px; }
@media (max-width: 1540px) { .hdr .wrap { padding-left: 32px; padding-right: 32px; } .hdr-in { gap: 16px; } .nav > a, .nav > button { padding: 10px 8px; font-size: 14.5px; } .nav > a::after, .nav > button::after { left: 8px; right: 8px; } .hdr-cta .btn { padding: 0 16px; } }
@media (max-width: 1240px) { .nav, .hdr-cta { display: none; } .burger { display: inline-flex; } .hdr-in { height: 76px; } .logo img { height: 40px; } }
.mega { position: absolute; left: 0; right: 0; top: 100%; background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 30px 60px rgba(10,61,92,.12); animation: megaIn .28s var(--ease) both; max-height: calc(100vh - 100px); overflow-y: auto; }
@keyframes megaIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.mega-in { padding-block: 28px 36px; }
.mega-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.mega-top h3 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.count { font-size: 12px; font-weight: 600; color: var(--slate); background: var(--pale); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.mega-top .btn { background: var(--pale); color: var(--navy); border: 1px solid var(--border); min-height: 40px; font-size: 14px; }
.mega-top .btn:hover { box-shadow: none; background: #E6F0F6; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.mgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mcard { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; text-decoration: none; display: grid; grid-template-rows: auto 1fr; background: #fff; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.mcard:hover { transform: translateY(-3px); box-shadow: var(--sh); border-color: #BBD3E2; }
.mcard .mi { height: 150px; background: radial-gradient(120% 100% at 50% 0%, #FFFFFF 0%, #F2F7FA 60%, #E3ECF2 100%); overflow: hidden; position: relative; }
.mgrid.two .mcard .mi, .mgrid.photo .mcard .mi { height: 122px; }
.mcard .mi img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: contain; transition: transform .4s var(--ease); filter: drop-shadow(0 8px 14px rgba(10,61,92,.14)); }
.mcard .mi img.ph { mix-blend-mode: multiply; filter: none; }
.mcard .mi img.cover { object-fit: cover; inset: 0; width: 100%; height: 100%; filter: none; }
.mcard:hover .mi img { transform: scale(1.06); }
.mcard .mb { padding: 12px 12px 14px; display: grid; gap: 4px; align-content: start; }
.mcard b { font-size: 14px; font-weight: 600; color: var(--ink); }
.mcard span { font-size: 13px; color: var(--slate); }
.mcard .link { font-size: 13px; font-weight: 500; }

/* drawer */
.drawer { position: fixed; inset: 0; z-index: 70; background: rgba(7,40,61,.45); display: flex; justify-content: flex-end; animation: fadeIn .2s ease both; }
.drawer-p { width: min(380px, 100%); height: 100%; background: #fff; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; align-content: start; gap: 2px; animation: slideIn .3s var(--ease) both; }
@keyframes slideIn { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.drawer-p a { padding: 12px 6px; border-bottom: 1px solid var(--border); text-decoration: none; font-weight: 500; color: var(--navy); }
.drawer-p .sub { padding-left: 18px; font-weight: 400; color: var(--slate); font-size: 15px; }

/* hero */
.hero { position: relative; overflow: hidden; background: var(--navy-deep); }
.slides { position: relative; height: clamp(600px, 52vw, 865px); }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .8s var(--ease), visibility .8s; }
.slide.on { opacity: 1; visibility: visible; z-index: 1; }
.slide .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 8s linear; }
.slide.on .bgimg { transform: scale(1); }
.slide .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,26,38,.86) 0%, rgba(10,26,38,.6) 45%, rgba(10,26,38,.25) 100%); }
.slide .inner { position: relative; height: 100%; display: flex; align-items: center; }
.s-copy { display: grid; gap: 22px; max-width: 640px; }
.s-copy > * { animation: none; }
.slide.on .s-copy > * { animation: rise .7s var(--ease) both; }
.slide.on .s-copy > *:nth-child(2) { animation-delay: .08s; } .slide.on .s-copy > *:nth-child(3) { animation-delay: .16s; } .slide.on .s-copy > *:nth-child(4) { animation-delay: .24s; } .slide.on .s-copy > *:nth-child(5) { animation-delay: .32s; } .slide.on .s-copy > *:nth-child(6) { animation-delay: .4s; } .slide.on .s-copy > *:nth-child(7) { animation-delay: .48s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.eyebrow-chip { display: inline-flex; align-items: center; gap: 8px; width: fit-content; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; }
.eyebrow-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.eyebrow-chip.light { background: rgba(17,144,200,.07); border-color: rgba(17,144,200,.3); color: var(--blue); }
.eyebrow-chip.amber::before { background: var(--amber); }
.eyebrow-chip.amber.light { background: rgba(249,169,48,.08); border-color: rgba(249,169,48,.4); color: #C77D0A; }
.rule { width: 36px; height: 3px; border-radius: 2px; background: var(--blue); }
.s-copy p { color: #E3ECF2; font-size: 17px; line-height: 1.6; }
.s-copy .btn { border-radius: 4px; min-height: 50px; }
.s-copy .btn.outline { background: #fff; }
.s-meta { display: flex; gap: 0; flex-wrap: wrap; margin-top: 18px; }
.s-meta div { padding-right: 26px; margin-right: 26px; border-right: 1px solid rgba(255,255,255,.18); display: grid; gap: 2px; }
.s-meta div:last-child { border: 0; }
.s-meta small { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); }
.s-meta span { font-size: 13px; color: #E3ECF2; }
.light-slide { background: #fff; }
.light-slide h1 { color: var(--ink); }
.light-slide .s-copy p { color: var(--slate); }
.light-slide .s-meta div { border-color: var(--border); }
.light-slide .s-meta span { color: var(--slate); }
.light-slide .s-meta small { font-family: var(--mono); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 13px; }
.split2 { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
.split2.wide { grid-template-columns: 45% 55%; }
.split2 .ph { position: relative; overflow: hidden; }
.split2 .ph img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 8s linear; }
.slide.on .split2 .ph img { transform: scale(1); }
.split2 .pc { background: #fff; display: flex; align-items: center; padding: 64px clamp(32px, 4vw, 72px); }
.ph-badge { position: absolute; left: 32px; top: 32px; background: rgba(10,26,38,.75); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 7px 14px; border-radius: 4px; display: flex; gap: 8px; align-items: center; backdrop-filter: blur(6px); }
.ph-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.ph-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 32px; background: rgba(10,26,38,.6); color: #fff; font-size: 13px; display: flex; gap: 10px; align-items: center; backdrop-filter: blur(4px); }
.ph-cap.card { left: 32px; right: auto; bottom: 32px; background: #fff; color: var(--ink); border-radius: 6px; padding: 10px 16px; box-shadow: var(--sh); }
.ph-cap svg { width: 18px; height: 18px; flex: none; }
.ph-cap.card b { color: var(--blue); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 4px; border: 1px solid rgba(17,144,200,.3); background: rgba(17,144,200,.06); color: var(--blue); }
.chip svg { width: 14px; height: 14px; }
.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ticks li { display: grid; grid-template-columns: 20px 1fr; gap: 12px; font-size: 14.5px; color: var(--ink); align-items: start; }
.ticks li::before { content: "✓"; width: 18px; height: 18px; border-radius: 4px; background: rgba(17,144,200,.12); color: var(--blue); font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
.prodcard { border: 1px solid var(--border); border-radius: 6px; background: #fff; overflow: hidden; box-shadow: var(--sh); width: 100%; max-width: 580px; }
.prodcard .pt { padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); }
.prodcard-wrap { flex: 1; display: flex; justify-content: flex-end; }
.prodcard .pi { height: 300px; overflow: hidden; padding: 20px; background: linear-gradient(180deg, #FAFCFD, #EEF3F7); display: grid; place-items: center; }
.prodcard .pi img { height: 100%; width: 100%; object-fit: contain; mix-blend-mode: multiply; animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.prodcard .ps { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--pale); }
.prodcard .ps div { padding: 14px 18px; border-left: 1px solid var(--border); display: grid; gap: 2px; }
.prodcard .ps div:first-child { border: 0; }
.prodcard .ps small { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--slate); }
.prodcard .ps b { font-size: 14px; color: var(--ink); }
.ctrl { position: absolute; inset: auto 0 0 0; z-index: 3; pointer-events: none; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 48px; height: 48px; border-radius: 4px; background: var(--blue); color: #fff; border: 0; cursor: pointer; display: grid; place-items: center; transition: background .2s, transform .2s; }
.arrow:hover { background: var(--blue-2); transform: translateY(-50%) scale(1.06); }
.arrow svg { width: 22px; height: 22px; }
.arrow.l { left: 24px; } .arrow.r { right: 24px; }
.dots { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 3; }
.dots button { width: 6px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: rgba(255,255,255,.55); cursor: pointer; transition: width .35s var(--ease), background .35s; position: relative; overflow: hidden; }
.dots button.on { width: 28px; background: rgba(17,144,200,.35); }
.dots button.on::after { content: ""; position: absolute; inset: 0; background: var(--blue); transform-origin: left; animation: prog 7s linear both; }
.hero.paused .dots button.on::after { animation-play-state: paused; }
@keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.counter { position: absolute; right: 152px; bottom: 26px; z-index: 3; font-family: var(--mono); font-size: 13px; color: #fff; }
.hero.lightc .dots button:not(.on) { background: #9AAAB8; }
.hero.lightc .counter { color: var(--blue); }
@media (max-width: 960px) {
  .slides { height: auto; min-height: 640px; }
  .slide { position: absolute; }
  .split2, .split2.wide { grid-template-columns: 1fr; grid-template-rows: 240px auto; }
  .split2 .pc { padding: 28px 24px 96px; align-items: start; }
  .slide .inner { align-items: flex-start; padding-top: 64px; }
  .prodcard-wrap { display: none; }
  .arrow { top: auto; bottom: 18px; transform: none; width: 40px; height: 40px; } .arrow:hover { transform: none; }
  .arrow.l { left: 16px; } .arrow.r { right: 16px; }
  .counter { display: none; }
  .ph-badge, .ph-cap.card { display: none; }
  .s-meta { display: none; }
  .slides { min-height: 0; height: 760px; }
  .split2, .split2.wide { grid-template-rows: 210px 1fr; }
  .light-slide .chips, .light-slide .note { display: none; }
  .light-slide .btns .btn { min-height: 44px; }
  .s-copy { gap: 16px; }
  .s-copy p { font-size: 15.5px; }
  .light-slide .h-hero { font-size: 34px !important; }
}

/* stat bar */
.statbar { background: var(--navy); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding-block: 64px; }
.stat { display: flex; align-items: center; gap: 22px; padding-left: 32px; border-left: 1px solid rgba(255,255,255,.1); }
.stat:first-child { border: 0; padding-left: 0; }
.stat b { font-family: var(--inter); font-size: clamp(30px, 2.6vw, 40px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--inter); font-size: 15px; line-height: 1.35; color: #E3ECF2; max-width: 14ch; }
@media (max-width: 900px) { .stats { grid-template-columns: 1fr 1fr; gap: 28px 0; padding-block: 44px; } .stat:nth-child(3) { border: 0; padding-left: 0; } .stat { gap: 12px; padding-left: 18px; flex-direction: column; align-items: flex-start; } }

/* service cards (image + gradient) */
.svc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 1000px) { .svc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .svc-grid { grid-template-columns: 1fr; } }

.bx { position: relative; overflow: hidden; isolation: isolate; border-radius: 22px; padding: clamp(26px, 3vw, 44px); background: linear-gradient(155deg, #10263A 0%, #0A1824 55%, #070F18 100%); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 10px; min-height: 250px; transition: transform .5s var(--ease), border-color .4s; }

.bx::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(17,144,200,.22), transparent 60%); }

.bx .waves path:nth-child(2), .award .waves path:nth-child(2) { animation-duration: 12s; opacity: .6; } .bx .waves path:nth-child(3), .award .waves path:nth-child(3) { animation-duration: 15s; opacity: .4; }

.bx.gold:hover { border-color: rgba(249,169,48,.45); }
